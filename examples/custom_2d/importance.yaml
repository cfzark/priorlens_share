schema_version: 1
run_mode: smoke
seed_scheme: sha256_64_v2
model:
  name: user_regression
  adapter: adapter.py
  stan: model.stan
  options:
    sigma: 1
data:
  x:
  - -1
  - -0.5
  - 0
  - 0.5
  - 1
  - 1.5
  y:
  - -1.1
  - -0.3
  - 0.1
  - 0.4
  - 1.2
  - 1.6
priors:
  interest:
    family: normal
    loc:
    - 0
    - 1
    sd:
    - 2
    - 1
  baseline:
    family: normal
    loc:
    - 0
    - 0
    sd:
    - 5
    - 5
prior_grid:
- prior_id: center
targets:
- id: beta_joint
  coordinates:
  - &id001
    variable: beta0
  - &id002
    variable: beta1
- id: beta0
  coordinates:
  - *id001
- id: beta1
  coordinates:
  - *id002
candidates:
  values:
  - 0
  - 1
  - 2
  meaning: number_augmented
  unit: observation
methods:
- preset: reimherr_project_bootstrap_v2
  id: reimherr
  posterior_draws: 512
  risk_reps: 4
  candidates:
    unit: observation
    meaning: baseline_size_offset
    values:
    - -1
    - 0
    - 1
- preset: wiesenfarth_project_plugin_v2
  id: wiesenfarth
  posterior_draws: 512
  risk_reps: 4
  candidates:
    unit: observation
    meaning: informative_size_reduction
    values:
    - -1
    - 0
    - 1
- preset: jones_source_adaptation_v2
  id: jones
  posterior_draws: 512
  paths: 2
  quantile_grid_size: 128
  projections: 8
  projection_rule: nig
  candidates:
    unit: observation
    meaning: number_augmented
    values:
    - 0
    - 1
- preset: cp_bootstrap_deletion_v2
  id: cp
  posterior_draws: 512
  paths: 2
  region: central
  alphas:
  - 0.05
  loss_family: historical
  gap_weight: 1
  cap_nominal: false
  cache_regions: true
  candidates:
    unit: observation
    meaning: number_deleted
    values:
    - 0
    - 1
inference:
  backend: importance
  posterior_reuse: none
  sobol_power: 15
  sobol_max_power: 15
execution: {}
seed: 20260312
output_root: results/custom_1d
